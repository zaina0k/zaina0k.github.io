<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <!-- Filled rounded-square mark: indigo-to-cyan gradient background, white ZA initials -->
  <rect width="100" height="100" rx="22" fill="url(#brandGrad)"/>
  <!-- Subtle accent border -->
  <rect x="3" y="3" width="94" height="94" rx="19" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.25"/>
  <!-- ZA initials: white, bold, centered -->
  <text
    x="50" y="65"
    font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="42"
    font-weight="800"
    letter-spacing="-1"
    fill="#ffffff"
    text-anchor="middle">ZA</text>
</svg>
